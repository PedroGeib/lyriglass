[package]
name = "lyriglass"
version = "1.0.0"
description = "Lightweight glass overlay for Spotify with synced lyrics"
authors = ["PedroGeib"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "native-tls", "http2", "charset"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
